[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codenode-benchmarks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["harbor==0.25.0"]

[project.scripts]
codenode-benchmark = "codenode_benchmarks.cli:main"

[tool.setuptools.packages.find]
include = ["codenode_benchmarks*"]
