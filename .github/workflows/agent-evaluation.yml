name: Agent evaluation evidence

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'bin/codenode-agent.cjs'
      - 'scripts/eval/**'
      - 'scripts/lib/eval-*.cjs'
      - 'scripts/lib/coding-*.cjs'
      - 'scripts/core/eval-*.cjs'
      - 'benchmarks/**'
      - '.github/workflows/agent-evaluation.yml'
  workflow_dispatch:
    inputs:
      live:
        type: boolean
        default: false
        description: Run a bounded model pilot using configured secrets
  workflow_call:
    inputs:
      live:
        type: boolean
        default: false
        required: false
  schedule:
    - cron: '17 19 * * 1'

permissions:
  contents: read

concurrency:
  group: agent-evaluation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:development-log
      - run: npm run eval:quality
      - run: npm run test:eval-quality
      - run: npm run test:coding-grader
      - run: npm run test:eval-system
      - run: npm run test:eval-campaign
      - run: npm run test:eval -- --report-dir=out/evals/ci-contracts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-evaluation-contract-evidence
          path: out/evals/
          retention-days: 14

  isolated-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: docker pull node:22.23.1-bookworm-slim
      - run: npm run test:eval-docker
      - name: Install pinned Harbor SDK
        run: |
          python3 -m venv /tmp/codenode-eval-tooling
          /tmp/codenode-eval-tooling/bin/pip install uv==0.9.5
          /tmp/codenode-eval-tooling/bin/uv sync --project benchmarks --locked
      - run: npm run test:benchmark-adapter
      - run: npm run test:eval-harbor-smoke

  live-pilot:
    needs: contracts
    if: >-
      github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_dispatch' && inputs.live) ||
       (github.event_name == 'schedule' && vars.CODENODE_EVAL_SCHEDULED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Freeze bounded pilot
        env:
          CODENODE_EVAL_BASE_URL: ${{ vars.CODENODE_EVAL_BASE_URL }}
          CODENODE_EVAL_MODEL: ${{ vars.CODENODE_EVAL_MODEL }}
        run: npm run eval:system -- prepare --output=out/evals/live --tasks=coding-timeout-default,coding-port-parser --trials=2 --mode=model --max-tokens=300000
      - name: Run diagnostic only
        run: npm run eval:system -- run --plan=out/evals/live/plan.json
        env:
          CODENODE_EVAL_API_KEY: ${{ secrets.CODENODE_EVAL_API_KEY }}
          CODENODE_EVAL_BASE_URL: ${{ vars.CODENODE_EVAL_BASE_URL }}
          CODENODE_EVAL_MODEL: ${{ vars.CODENODE_EVAL_MODEL }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-evaluation-live-pilot
          path: out/evals/live/
          retention-days: 30
